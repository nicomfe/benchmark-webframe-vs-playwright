<!doctype html>
<html>
<head><meta charset="utf-8"><title>spa</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 2rem; }
  li.done { text-decoration: line-through; color: #888; }
</style>
</head>
<body>
<h1 id="title">Loading…</h1>
<ul id="list"></ul>
<script>
// Minimal vanilla single-page app: fetch JSON from the local server, render
// it, then log READY.
async function main() {
  const res = await fetch("/api/items.json");
  if (!res.ok) throw new Error("fetch failed: " + res.status);
  const items = await res.json();
  const ul = document.getElementById("list");
  for (const it of items) {
    const li = document.createElement("li");
    li.textContent = it.name;
    li.dataset.id = String(it.id);
    if (it.done) li.classList.add("done");
    ul.appendChild(li);
  }
  document.getElementById("title").textContent = "Items (" + items.length + ")";
  console.log("READY");
}
main();
</script>
</body>
</html>
