<!doctype html>
<html>
<head><meta charset="utf-8"><title>ok</title></head>
<body>
<!-- S7 rewrites the text and data-rev of this heading on each loop iteration. -->
<h1 id="title" data-rev="0">Items rev 0</h1>
<ul id="list"></ul>
<script>
const ul = document.getElementById("list");
for (let i = 1; i <= 100; i++) {
  const li = document.createElement("li");
  li.textContent = "item " + i;
  ul.appendChild(li);
}
window.addEventListener("load", () => console.log("READY"));
</script>
</body>
</html>
